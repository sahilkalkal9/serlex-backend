name: Deploy Serlex Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to Enhance Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          test -n "${{ secrets.SERVER_HOST }}" || (echo "SERVER_HOST missing" && exit 1)
          test -n "${{ secrets.SERVER_USER }}" || (echo "SERVER_USER missing" && exit 1)
          test -n "${{ secrets.SERVER_PORT }}" || (echo "SERVER_PORT missing" && exit 1)
          test -n "${{ secrets.SERVER_SSH_KEY }}" || (echo "SERVER_SSH_KEY missing" && exit 1)
          echo "All required secrets are present"

      - name: Create backend tar
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='*.log' \
            --exclude='.env' \
            --exclude='.github' \
            -czf serlex-backend.tar.gz .

      - name: Upload tar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "serlex-backend.tar.gz"
          target: "/root"

      - name: Deploy backend on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            APP_DIR="/var/www/a0973e2f-1de5-4fa0-b314-d5045219fdc2"
            BACKUP_DIR="/root/serlex-backend-safe"

            echo "Going to backend app directory..."
            cd "$APP_DIR"

            echo "Saving .env..."
            mkdir -p "$BACKUP_DIR"
            if [ -f ".env" ]; then
              cp .env "$BACKUP_DIR/.env"
            fi

            echo "Stopping old backend process on port 5000..."
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 5000/tcp || true
            else
              OLD_PID=$(ss -ltnp 2>/dev/null | grep ':5000' | sed -n 's/.*pid=\([0-9]*\).*/\1/p' | head -1)
              if [ -n "$OLD_PID" ]; then
                kill "$OLD_PID" || true
              fi
            fi

            sleep 2

            echo "Cleaning old backend files except .env..."
            find . -mindepth 1 -maxdepth 1 ! -name ".env" -exec rm -rf {} +

            echo "Extracting latest backend..."
            cp /root/serlex-backend.tar.gz .
            tar -xzf serlex-backend.tar.gz

            echo "Restoring .env..."
            if [ -f "$BACKUP_DIR/.env" ]; then
              cp "$BACKUP_DIR/.env" .env
            fi

            echo "Installing dependencies..."
            npm install

            echo "Checking server.js syntax..."
            node --check server.js

            echo "Starting backend in background..."
            nohup npm start > backend-live.log 2>&1 &

            sleep 5

            echo "Checking backend port..."
            ss -ltnp | grep ':5000' || true

            echo "Testing backend locally..."
            curl -I http://localhost:5000 || true

            echo "Cleaning tar files..."
            rm -f /root/serlex-backend.tar.gz
            rm -f serlex-backend.tar.gz

            echo "Backend deployment completed."