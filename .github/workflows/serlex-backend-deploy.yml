name: Deploy Serlex Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to Enhance Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          test -n "${{ secrets.SERVER_HOST }}" || (echo "SERVER_HOST missing" && exit 1)
          test -n "${{ secrets.SERVER_USER }}" || (echo "SERVER_USER missing" && exit 1)
          test -n "${{ secrets.SERVER_PORT }}" || (echo "SERVER_PORT missing" && exit 1)
          test -n "${{ secrets.SERVER_SSH_KEY }}" || (echo "SERVER_SSH_KEY missing" && exit 1)
          echo "All required secrets are present"

      - name: Create backend tar
        run: |
          rm -f serlex-backend.tar.gz

          # Archive only tracked Git files
          git archive \
            --format=tar.gz \
            --output=serlex-backend.tar.gz \
            HEAD

      - name: Upload tar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "serlex-backend.tar.gz"
          target: "/root"

      - name: Deploy backend on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            APP_DIR="/var/www/a0973e2f-1de5-4fa0-b314-d5045219fdc2"
            BACKUP_DIR="/root/serlex-backend-safe"
            TEMP_DIR="/tmp/serlex-backend-release"

            echo "Loading Node/NPM..."

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
              echo "Node/NPM not found. Installing..."
              /usr/bin/install_nvm_and_node.sh || true

              export NVM_DIR="$HOME/.nvm"

              if [ -s "$NVM_DIR/nvm.sh" ]; then
                . "$NVM_DIR/nvm.sh"
              fi
            fi

            if command -v nvm >/dev/null 2>&1; then
              nvm install stable
              nvm use stable
            fi

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            mkdir -p "$BACKUP_DIR"

            cd "$APP_DIR"

            echo "Backing up .env..."
            if [ -f ".env" ]; then
              cp .env "$BACKUP_DIR/.env"
            fi

            echo "Stopping existing backend..."
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 5000/tcp || true
            else
              PID=$(ss -ltnp 2>/dev/null | grep ':5000' | sed -n 's/.*pid=\([0-9]*\).*/\1/p' | head -1)
              [ -n "$PID" ] && kill "$PID" || true
            fi

            sleep 2

            echo "Preparing release directory..."
            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"

            cp /root/serlex-backend.tar.gz "$TEMP_DIR/"
            cd "$TEMP_DIR"

            echo "Extracting release..."
            tar -xzf serlex-backend.tar.gz

            if [ ! -f "server.js" ]; then
              echo "ERROR: server.js not found after extraction."
              exit 1
            fi

            echo "Deploying files..."
            cd "$APP_DIR"

            find . -mindepth 1 -maxdepth 1 ! -name ".env" -exec rm -rf {} +

            cp -a "$TEMP_DIR"/. .

            echo "Restoring .env..."
            if [ -f "$BACKUP_DIR/.env" ]; then
              cp "$BACKUP_DIR/.env" .env
            fi

            echo "Installing dependencies..."
            npm install --production

            echo "Checking server syntax..."
            node --check server.js

            echo "Starting backend..."
            nohup npm start > backend-live.log 2>&1 &

            sleep 5

            echo "Checking listening port..."
            ss -ltnp | grep ':5000' || true

            echo "Testing backend..."
            curl -I http://localhost:5000 || true

            echo "Cleaning temporary files..."
            rm -rf "$TEMP_DIR"
            rm -f /root/serlex-backend.tar.gz

            echo "✅ Backend deployment completed successfully."